<title id="title">Weekly rhythm</title>
<desc id="desc">Contributions per weekday over the last 12 months (6,557 in total): Mon 949, Tue 1023, Wed 1354, Thu 980, Fri 1161, Sat 601, Sun 489. Busiest: Wed. Quietest: Sun. On weekdays: 83%.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #1f2328; }
